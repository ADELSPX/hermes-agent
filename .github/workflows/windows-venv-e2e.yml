name: Windows venv-holder live E2E

# wine2e/upd-txn-le-* ONLY (lane LE round 2): run the Desktop update-marker
# vitest cells on a real Windows host (CIM creation-time probe, A1).
on:
  push:
    branches:
      - 'wine2e/**'

permissions:
  contents: read

jobs:
  desktop-update-marker:
    name: desktop update-marker vitest (windows)
    runs-on: windows-latest-32-core
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pm
        with:
          toolchain: all
          cache: false
          cache-python: false
          cache-node: false
      - name: Install desktop workspace (no native postinstalls)
        run: npm ci --workspace apps/desktop --workspace tests-js --include-workspace-root --include=dev --ignore-scripts --no-audit --no-fund
      - name: update-marker cells on Windows
        working-directory: apps/desktop
        run: node ../../node_modules/vitest/vitest.mjs run --project electron electron/update-marker.test.ts --reporter=verbose
